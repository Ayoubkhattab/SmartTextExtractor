[project]
name = "smart-text-extractor"
version = "0.1.0"
description = "Local OCR text extraction tool with scanner integration (Arabic/English)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
windows = ["pywin32>=306"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
