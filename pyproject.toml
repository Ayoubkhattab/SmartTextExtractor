[project]
name = "smart-text-extractor"
version = "0.1.0"
description = "Local OCR text extraction tool with scanner integration (Arabic/English)"
requires-python = ">=3.11"
dependencies = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "PyQt6>=6.7",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]
# arabic-reshaper/python-bidi are test-only: Pillow has no libraqm on this
# platform, so tests that generate synthetic Arabic images must pre-shape
# the text themselves. Real scanned pages never need this — their glyphs
# are already correctly shaped ink on paper.
dev = ["pytest>=8.0", "pytest-qt>=4.4", "arabic-reshaper>=3.0", "python-bidi>=0.4"]
# Qari-OCR (ocr/qari_engine.py), the hybrid pipeline's prose/heading
# engine — deliberately NOT a base dependency: several GB of downloads and
# a CUDA GPU (8GB+ VRAM) it doesn't degrade gracefully without at install
# time, only at runtime (ocr/hybrid_engine.py falls back to Tesseract-only
# when this group isn't installed or no GPU is present). "torch" here
# resolves to whatever build PyPI serves by default (often CPU-only or the
# wrong CUDA version) — install a matching CUDA build from
# https://pytorch.org/get-started/locally/ (e.g. `--index-url
# https://download.pytorch.org/whl/cu128`) *before* this group, or `pip
# install '.[vlm]'` alone will leave torch.cuda.is_available() False.
vlm = ["torch>=2.4", "transformers>=4.45", "accelerate>=0.34", "qwen-vl-utils>=0.0.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
