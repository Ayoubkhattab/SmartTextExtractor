name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract engine (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress -y
      - name: Install Tesseract engine + Qt runtime libs (Linux)
        if: runner.os != 'Windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr fonts-noto \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      # Language data is fetched directly rather than relying on each
      # platform's package naming for it, so both runners test against the
      # exact same ara/eng/osd files (see docs/phases/phase-2-ocr-pipeline.md).
      - name: Download tessdata (ara, eng, osd)
        shell: bash
        run: |
          mkdir -p tessdata
          curl -sL -o tessdata/ara.traineddata https://github.com/tesseract-ocr/tessdata/raw/main/ara.traineddata
          curl -sL -o tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata
          curl -sL -o tessdata/osd.traineddata https://github.com/tesseract-ocr/tessdata/raw/main/osd.traineddata

      - name: Install (Windows)
        if: runner.os == 'Windows'
        run: pip install -e ".[dev,windows]"
      - name: Install (Linux)
        if: runner.os != 'Windows'
        run: pip install -e ".[dev]"

      - run: pytest -v
        env:
          TESSDATA_PREFIX: ${{ github.workspace }}/tessdata
          QT_QPA_PLATFORM: offscreen
